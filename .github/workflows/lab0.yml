name: Weekly assignment checks

on:
  push:
  pull_request:

jobs:
  verify-lab0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Trace integrity self-test
        run: python week01/COSC726_W01_hello_agent_mock.py --self-test
      - name: Annotation check
        run: python week01/COSC726_W01_hello_agent_mock.py --check

  verify-lab1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: LLM foundations self-test
        run: python week02/COSC726_W02_llm_foundations.py --self-test

  verify-lab2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install prompt portfolio dependency
        run: python -m pip install "jsonschema>=4.18,<5"
      - name: Prompt portfolio tests
        run: python -m unittest week03.test_triage

  verify-lab3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install typed-agent dependency
        run: python -m pip install "pydantic>=2.7,<3"
      - name: ReAct agent self-test
        run: python week04/hello_agent.py --self-test

  verify-lab5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scoped-memory self-test
        run: python week06/layla_memory.py --self-test
